<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/x3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X3 Software Solution — Custom Software Development & Technology Consulting</title>
    <meta name="description" content="X3 Software Solution builds modern, high-quality digital products. Custom software development, web & mobile applications, UI/UX design, and technology consulting." />
    <meta name="keywords" content="software development, web application, mobile app, technology consulting, UI/UX design, digital transformation, X3" />

    <meta property="og:description" content="We build modern, high-quality digital products and technology solutions." />
    <meta property="og:type" content="website" />
    <!-- Geist + Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Mono font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Storage key and logic mirror src/theme/theme-context.ts.
      (function () {
        try {
          var stored = localStorage.getItem('x3-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* storage blocked — fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
